<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TourEase - Sri Lanka Tourism</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700&family=Noto+Sans+Sinhala:wght@400;700&family=Noto+Sans+Tamil:wght@400;700&display=swap" rel="stylesheet">
    <style>
      :root {
        /* 1. COLOR PALETTE */
        --color-primary-50: #e0f2fe;
        --color-primary-100: #bae6fd;
        --color-primary-500: #0ea5e9;
        --color-primary-600: #0284c7;
        --color-primary-700: #0369a1;
        --color-secondary-500: #ff6b35;
        --color-secondary-600: #ea580c;
        --color-accent-gold: #d4af37;
        --color-accent-green: #2e7d32;
        --color-neutral-50: #f8fafc;
        --color-neutral-100: #f1f5f9;
        --color-neutral-200: #e2e8f0;
        --color-neutral-500: #64748b;
        --color-neutral-800: #1e293b;
        --color-neutral-900: #0f172a;
        --color-success: #10b981;
        --color-warning: #f59e0b;
        --color-error: #ef4444;
        --color-info: #3b82f6;
        --radius-sm: 4px;
        --radius-md: 8px;
        --radius-lg: 12px;
        --radius-xl: 16px;
        --radius-full: 9999px;
        --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
        --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
      }

      @keyframes shimmer {
        100% {
          transform: translateX(100%);
        }
      }

      @keyframes shake {
        0%, 100% { transform: translateX(0); }
        10%, 30%, 50%, 70%, 90% { transform: translateX(-4px); }
        20%, 40%, 60%, 80% { transform: translateX(4px); }
      }

      .animate-shake {
        animation: shake 0.6s cubic-bezier(.36,.07,.19,.97) both;
      }

      body {
        font-family: 'Inter', 'Noto Sans Sinhala', 'Noto Sans Tamil', sans-serif;
        background-color: var(--color-neutral-50);
        color: var(--color-neutral-900);
      }

      h1, h2, h3 {
        font-family: 'Playfair Display', serif;
      }

      .btn-primary { background-color: var(--color-primary-500); color: white; transition: all 0.2s ease; }
      .btn-primary:hover { background-color: var(--color-primary-600); transform: translateY(-1px); box-shadow: var(--shadow-md); }
      .btn-secondary { background-color: var(--color-secondary-500); color: white; transition: all 0.2s ease; }
      .btn-ghost { background-color: transparent; border: 1px solid var(--color-primary-500); color: var(--color-primary-500); transition: all 0.2s ease; }
      .btn-danger { background-color: var(--color-error); color: white; transition: all 0.2s ease; }
      
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

      /* Global Form Visibility Fixes */
      input[type="text"],
      input[type="date"],
      input[type="time"],
      input[type="email"],
      input[type="password"],
      input[type="tel"],
      input[type="number"],
      select,
      textarea {
        color: #1F2937 !important; /* slate-800 */
        background-color: #FFFFFF !important;
      }

      input::placeholder {
        color: #9CA3AF !important; /* gray-400 */
        opacity: 1;
      }

      select option {
        color: #1F2937 !important;
        background-color: #FFFFFF !important;
        padding: 10px;
      }

      /* Specific Fix for Search Form inside White Background Containers */
      .bg-white input, 
      .bg-white select, 
      .bg-white textarea {
        color: #1F2937 !important;
      }

      /* Hide default browser calendar/time icons to use custom icons */
      input[type="date"]::-webkit-inner-spin-button,
      input[type="date"]::-webkit-calendar-picker-indicator,
      input[type="time"]::-webkit-inner-spin-button,
      input[type="time"]::-webkit-calendar-picker-indicator {
          display: none;
          -webkit-appearance: none;
      }

      /* Standardize date/time input appearance across browsers */
      /* Normalizing height and removing inner padding that causes misalignment */
      input[type="date"],
      input[type="time"] {
          min-height: 48px;
          height: 48px;
          display: flex;
          align-items: center;
          padding-top: 0 !important;
          padding-bottom: 0 !important;
          margin: 0 !important;
          line-height: 1 !important;
          box-sizing: border-box !important;
      }

      /* Firefox specific reset for date/time height */
      @-moz-document url-prefix() {
        input[type="date"],
        input[type="time"] {
          padding-block: 0;
        }
      }
    </style>
